# XcodeGen project: run `xcodegen generate` in this folder to make GAL.xcodeproj (the .xcodeproj is not kept in git).
name: GAL
options:
  bundleIdPrefix: com.sangar
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Put your Apple team ID here (Xcode > Settings > Accounts), or pick the team in Xcode's Signing tab.
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"

targets:
  GAL:
    type: application
    platform: iOS
    sources:
      - path: GAL
      - path: Shared
    info:
      path: GAL/Info.plist
      properties:
        CFBundleDisplayName: GAL
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: GAL/GAL.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.sangar.gal]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sangar.gal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: GALMonitor
      - target: GALShieldConfig
      - target: GALShieldAction

  GALMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: GALMonitor
      - path: Shared
    info:
      path: GALMonitor/Info.plist
      properties:
        CFBundleDisplayName: GAL Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
    entitlements:
      path: GALMonitor/GALMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.sangar.gal]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sangar.gal.monitor

  GALShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - path: GALShieldConfig
      - path: Shared
    info:
      path: GALShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: GAL Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: GALShieldConfig/GALShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.sangar.gal]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sangar.gal.shieldconfig

  GALShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: GALShieldAction
      - path: Shared
    info:
      path: GALShieldAction/Info.plist
      properties:
        CFBundleDisplayName: GAL Shield Action
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: GALShieldAction/GALShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.sangar.gal]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sangar.gal.shieldaction
